<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markdown Live Preview</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      id="prismTheme"
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"
    />
  </head>
  <body data-layout="split" data-outline="on" data-sidebar="on">
    <header class="toolbar">
      <h1 class="brand">Markdown Live Preview</h1>
      <div class="actions">
        <button id="filesBtn" type="button" title="Toggle files sidebar">
          📁 Files
        </button>
        <button id="outlineBtn" type="button" title="Toggle outline panel">
          📑 Outline
        </button>
        <span class="layout-group" role="group" aria-label="Layout">
          <button id="layoutEditorBtn" type="button" title="Editor only">
            Editor
          </button>
          <button
            id="layoutSplitBtn"
            type="button"
            class="is-active"
            title="Split view"
          >
            Split
          </button>
          <button id="layoutPreviewBtn" type="button" title="Preview only">
            Preview
          </button>
        </span>
        <button
          id="themeBtn"
          type="button"
          title="Toggle theme (light / dark / system)"
        >
          Theme
        </button>
        <div class="dropdown" id="exportDropdown">
          <button
            id="exportMenuBtn"
            type="button"
            aria-haspopup="menu"
            aria-expanded="false"
            title="Export current or all files"
          >
            ⬇ Export ▾
          </button>
          <ul id="exportMenu" class="dropdown-menu" role="menu" hidden>
            <li role="none">
              <button id="exportBtn" type="button" role="menuitem">
                📝 Markdown (.md)
              </button>
            </li>
            <li role="none">
              <button id="exportDocxBtn" type="button" role="menuitem">
                📄 Word (.docx)
              </button>
            </li>
            <li role="none">
              <button id="exportPdfBtn" type="button" role="menuitem">
                🗄️ PDF (.pdf)
              </button>
            </li>
            <li role="none">
              <button id="exportZipBtn" type="button" role="menuitem">
                📦 All files (.zip)
              </button>
            </li>
          </ul>
        </div>
      </div>
    </header>
    <div class="shell">
      <aside class="shell-sidebar" aria-label="Sidebar">
        <div id="filesPanel" class="files-panel" aria-label="Files">
          <div class="files-header">
            <span class="files-title">Files</span>
            <span class="files-actions">
              <button id="newFileBtn" type="button" title="New file">
                + File
              </button>
              <button id="newFolderBtn" type="button" title="New folder">
                + Folder
              </button>
              <button
                id="clearAllBtn"
                type="button"
                class="danger"
                title="Clear all workspace"
              >
                ✕
              </button>
            </span>
          </div>
          <ul id="filesTree" class="files-tree"></ul>
          <div id="filesUsage" class="files-usage" aria-live="polite"></div>
        </div>
        <div id="outline" class="outline" aria-label="Document outline"></div>
      </aside>
      <main class="split">
        <section class="pane pane-editor">
          <div
            id="tabBar"
            class="tab-bar"
            role="tablist"
            aria-label="Open files"
          ></div>
          <textarea
            id="editor"
            spellcheck="false"
            placeholder="# Start writing markdown..."
          ></textarea>
        </section>
        <div
          id="splitter"
          class="splitter"
          role="separator"
          aria-orientation="vertical"
          tabindex="0"
        ></div>
        <section class="pane pane-preview">
          <article id="preview" class="preview"></article>
        </section>
      </main>
    </div>
    <div id="dropOverlay" class="drop-overlay" aria-hidden="true">
      <div class="drop-card">Drop Markdown files or folders to import</div>
    </div>

    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked-footnote@1.2.2/dist/index.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-typescript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
    <script src="https://unpkg.com/docx@8.5.0/build/index.umd.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="app.js" defer></script>
  </body>
</html>
